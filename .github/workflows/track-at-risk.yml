name: 追蹤 Steam 下架風險應用程式

on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: 簽出倉庫
        uses: actions/checkout@v5

      - name: 設定 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 安裝相依套件
        run: pip install requests beautifulsoup4

      - name: 抓取並解析下架風險應用程式
        env:
          STEAM_REFRESH_TOKEN: ${{ secrets.STEAM_REFRESH_TOKEN }}
        run: python scripts/parse_at_risk.py

      - name: 提交並推送變更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games_list.txt README.md
          git diff --cached --quiet && echo "無變更" || \
            git commit -m "chore: 更新下架風險遊戲清單 $(date -u +%Y-%m-%d)" && \
            git push
