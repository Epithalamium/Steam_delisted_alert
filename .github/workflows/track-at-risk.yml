name: Track Steam At-Risk Apps

on:
  schedule:
    # Run every 2 days at 06:17 UTC
    - cron: '17 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4
          npm install steam-session

      - name: Mint steamLoginSecure from Refresh Token
        env:
          STEAM_REFRESH_TOKEN: ${{ secrets.STEAM_REFRESH_TOKEN }}
        run: |
          node -e '
          const { LoginSession, EAuthTokenPlatformType } = require("steam-session");
          const fs = require("fs");
          (async () => {
            try {
              // 你的 token 含有 client，这里使用 SteamClient 平台加载并通过官方协议换取 Web Cookie
              const session = new LoginSession(EAuthTokenPlatformType.SteamClient);
              session.refreshToken = process.env.STEAM_REFRESH_TOKEN.trim();
              const cookies = await session.getWebCookies();
              const loginCookie = cookies.find(c => c.startsWith("steamLoginSecure="));
              if (!loginCookie) throw new Error("No steamLoginSecure in returned cookies");
              const val = decodeURIComponent(loginCookie.split("=")[1].split(";")[0]);
              fs.appendFileSync(process.env.GITHUB_ENV, `STEAMLOGINSECURE=${val}\n`);
              console.log("Successfully minted fresh steamLoginSecure via steam-session!");
            } catch (err) {
              console.error("Failed to mint cookie:", err.message);
              process.exit(1);
            }
          })();
          '

      - name: Fetch and parse at-risk apps
        run: python scripts/parse_at_risk.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games_list.txt README.md
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "chore: update at-risk games list $(date -u +%Y-%m-%d)" && \
            git push
